<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>주다운 · 게임 기획 포트폴리오</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Orbit&family=Silkscreen&display=swap">
<style id="pf-style">
/* Layout: a game "character sheet" — status card hero, quest-card grid split by party/solo, log-style career timeline, side drawer editor for the owner. */
:root{
  --bg:#0c1120;--bg2:#111a2e;--panel:#162036;--panel2:#1b2742;--line:#2a3a5e;--line2:#3c5283;
  --fg:#e7ebf5;--muted:#93a0bf;--faint:#647194;
  --gold:#f0b541;--gold-ink:#1b1305;--team:#4fc3e8;--solo:#b98cff;--ok:#7bd88f;--danger:#ff7070;
  --f-disp:'Orbit','IBM Plex Sans KR',system-ui,sans-serif;
  --f-body:'IBM Plex Sans KR',system-ui,-apple-system,'Malgun Gothic',sans-serif;
  --f-px:'Silkscreen','IBM Plex Sans KR',system-ui,'Malgun Gothic',sans-serif;
  --gut-l:max(16px,env(safe-area-inset-left,0px));--gut-r:max(16px,env(safe-area-inset-right,0px));
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.65 var(--f-body);
  background-image:linear-gradient(var(--bg2) 1px,transparent 1px),linear-gradient(90deg,var(--bg2) 1px,transparent 1px);
  background-size:32px 32px;background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--f-disp);font-weight:400;text-wrap:balance;margin:0;line-height:1.25}
.px{font-family:var(--f-px);letter-spacing:.06em;text-transform:uppercase;font-size:11px}
.wrap{max-width:1120px;margin:0 auto;padding-left:var(--gut-l);padding-right:var(--gut-r)}
.page{transition:margin .2s}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:12px;min-height:56px;flex-wrap:wrap;padding-block:6px}
.brand{font-family:var(--f-disp);font-size:16px;display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand i{width:12px;height:12px;background:var(--gold);transform:rotate(45deg);flex:none}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;gap:2px;flex-wrap:wrap}
.nav button,.seg button{background:none;border:0;padding:6px 10px;cursor:pointer;color:var(--muted);font-size:13px}
.nav button:hover{color:var(--fg)}
.seg{display:flex;border:1px solid var(--line2)}
.seg button{padding:4px 10px;font-family:var(--f-px);font-size:11px}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink)}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--panel);padding:8px 14px;cursor:pointer;text-decoration:none;font-size:14px;line-height:1.3}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);font-weight:700}
.btn.small{padding:4px 10px;font-size:12px}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}

/* framed panel with HUD corner brackets */
.frame{position:relative;background:var(--panel);border:1px solid var(--line)}
.frame::before,.frame::after{content:"";position:absolute;width:12px;height:12px;border:2px solid var(--rar,var(--gold));pointer-events:none}
.frame::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
.frame::after{bottom:-1px;right:-1px;border-left:0;border-top:0}

section{padding-block:56px 8px}
.shead{display:flex;align-items:baseline;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.shead .px{color:var(--gold)}
.shead h2{font-size:clamp(22px,3vw,28px)}
.shead .aside{margin-left:auto;color:var(--muted);font-size:13px}

/* hero / status */
.hero{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:20px;padding-top:36px}
.portrait{padding:18px;display:flex;flex-direction:column;gap:14px}
.portrait .pic{aspect-ratio:3/4;width:100%;max-width:100%;background:var(--bg2);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden}
.portrait .pic img{width:100%;height:100%;object-fit:cover;object-position:center 20%;display:block}
.portrait .pic b{font-family:var(--f-disp);font-size:72px;color:var(--gold);font-weight:400}
.counts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.counts div{border:1px solid var(--line);padding:6px 2px;background:var(--bg2)}
.counts b{display:block;font-family:var(--f-disp);font-size:22px;font-weight:400;font-variant-numeric:tabular-nums}
.counts .px{color:var(--muted);font-size:12px;letter-spacing:0}
.status{padding:26px 28px;display:flex;flex-direction:column;gap:18px;min-width:0}
.status .cls{color:var(--gold)}
.status h1{font-size:clamp(30px,5vw,48px)}
.tagline{font-size:18px;color:var(--fg);max-width:60ch;margin:0}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px 16px;align-items:start;border-top:1px dashed var(--line);padding-top:16px}
.kv>.px{color:var(--muted);padding-top:3px;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line2);padding:2px 10px;font-size:13px;background:var(--bg2)}
.chip.g{border-color:var(--gold);color:var(--gold)}
.contact{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mail{font-family:var(--f-body);user-select:all;padding:2px 0}
.about{max-width:68ch;color:var(--fg)}
.about p{margin:0 0 12px}

/* quest cards */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.tabs button{border:1px solid var(--line2);background:var(--panel);padding:7px 14px;cursor:pointer;font-size:14px;display:flex;gap:8px;align-items:center}
.tabs button[aria-pressed="true"]{border-color:var(--gold);background:var(--panel2);color:var(--gold)}
.tabs .n{font-family:var(--f-px);font-size:11px;color:var(--muted)}
.dot{width:9px;height:9px;transform:rotate(45deg);display:inline-block;background:var(--c)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.card{text-decoration:none;display:flex;flex-direction:column;cursor:pointer;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-3px);border-color:var(--rar)}
.cover{aspect-ratio:16/9;max-width:100%;background:var(--bg2);border-bottom:1px solid var(--line);overflow:hidden;position:relative}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover .ph{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-disp);font-size:56px;color:var(--rar);opacity:.55;
  background:repeating-linear-gradient(135deg,transparent 0 10px,color-mix(in srgb,var(--rar) 10%,transparent) 10px 11px)}
.badge{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border:1px solid var(--rar);color:var(--rar);background:color-mix(in srgb,var(--rar) 12%,var(--bg))}
.cover .badge{position:absolute;top:10px;left:10px}
.sample{position:absolute;top:10px;right:10px;background:var(--gold);color:var(--gold-ink);padding:2px 8px}
.cbody{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.cbody h3{font-size:19px}
.meta{color:var(--muted);font-size:13px}
.sum{margin:0;color:var(--fg);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.res{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:8px}
.res span{border:1px solid var(--line);color:var(--muted);padding:1px 6px;font-size:10px}
.empty{padding:28px;color:var(--muted);text-align:center}

/* timeline */
.log{display:flex;flex-direction:column;border-left:2px solid var(--line2);margin-left:6px}
.entry{position:relative;padding:0 0 26px 26px;display:grid;grid-template-columns:150px minmax(0,1fr);gap:4px 20px}
.entry::before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;background:var(--bg);border:2px solid var(--gold);transform:rotate(45deg)}
.entry .when{color:var(--gold);font-variant-numeric:tabular-nums;font-size:13px;padding-top:2px}
.entry h3{font-size:18px}
.entry .org{color:var(--muted);font-size:14px}
.entry p{margin:6px 0 0;max-width:64ch}

/* resume */
.resume{padding:24px 26px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.resume p{margin:0;flex:1 1 320px;max-width:64ch}

footer{padding-block:56px 40px;color:var(--faint);font-size:13px}

/* detail overlay */
.overlay{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(4px);overflow-y:auto;
  padding:calc(24px + env(safe-area-inset-top,0px)) var(--gut-r) calc(24px + env(safe-area-inset-bottom,0px)) var(--gut-l)}
.dlg{max-width:920px;margin:0 auto;background:var(--panel)}
.dhead{padding:24px 26px 18px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.dhead .top{display:flex;gap:10px;align-items:center}
.dhead .x{margin-left:auto}
.dhead h2{font-size:clamp(24px,4vw,34px)}
.dcover{aspect-ratio:16/9;max-width:100%;background:var(--bg2);overflow:hidden;border-bottom:1px solid var(--line)}
.dcover img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.dbody{padding:22px 26px 28px;display:flex;flex-direction:column;gap:26px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.stats div{background:var(--bg2);padding:12px 14px;min-width:0}
.stats .px{color:var(--muted);display:block;margin-bottom:2px;font-size:12px}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.metric{border:1px solid var(--gold);padding:12px 14px;background:color-mix(in srgb,var(--gold) 7%,var(--bg2))}
.metric b{display:block;font-family:var(--f-disp);font-weight:400;font-size:26px;color:var(--gold);font-variant-numeric:tabular-nums;line-height:1.2}
.metric span{font-size:13px;color:var(--fg)}
.blk h3{font-size:15px;color:var(--gold);margin-bottom:8px;display:flex;gap:10px;align-items:center}
.blk h3::before{content:"";width:8px;height:8px;background:var(--gold);transform:rotate(45deg)}
.blk p{margin:0 0 10px;max-width:70ch}
.mats{display:flex;flex-wrap:wrap;gap:8px}
.mats .btn .px{border:1px solid currentColor;padding:0 5px;font-size:10px;color:var(--gold)}
.mats .yt{border-color:var(--danger)}
.mats .yt .px{color:var(--danger)}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.shots button{padding:0;border:1px solid var(--line);background:var(--bg2);aspect-ratio:16/10;max-width:100%;overflow:hidden;cursor:zoom-in}
.shots img{width:100%;height:100%;object-fit:cover;display:block}
.lightbox{position:fixed;inset:0;z-index:60;background:rgba(5,8,15,.94);display:grid;place-items:center;padding:24px;cursor:zoom-out}
.lightbox img{max-height:100%;object-fit:contain}

/* editor drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);z-index:70;background:var(--bg2);border-left:1px solid var(--line2);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
@media (min-width:1180px){body.editing .page{margin-right:560px}}
.dtop{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.dtop h2{font-size:18px;margin-right:auto}
.etabs{display:flex;border-bottom:1px solid var(--line)}
.etabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:10px;cursor:pointer;color:var(--muted)}
.etabs button[aria-pressed="true"]{color:var(--gold);border-bottom-color:var(--gold)}
.escroll{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:16px}
.efoot{border-top:1px solid var(--line);padding:12px 18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.efoot .st{margin-right:auto;font-size:12px;color:var(--muted)}
.efoot .st b{color:var(--gold);font-weight:500}
.f{display:flex;flex-direction:column;gap:5px}
.f>label,.f>.lab{font-size:13px;color:var(--muted)}
.f .hint{font-size:12px;color:var(--faint)}
.bi{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bi>div{position:relative;min-width:0}
.bi .tag{position:absolute;top:6px;right:8px;font-family:var(--f-px);font-size:9px;color:var(--faint);pointer-events:none}
input[type=text],input[type=url],input[type=email],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line2);padding:8px 10px;font-size:14px;border-radius:0}
.bi input,.bi textarea{padding-right:30px}
textarea{resize:vertical;min-height:84px;line-height:1.5}
fieldset{border:1px solid var(--line);padding:14px;margin:0;display:flex;flex-direction:column;gap:12px}
legend{padding:0 6px;font-size:13px;color:var(--gold)}
.plist{display:flex;flex-direction:column;gap:6px}
.prow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);padding:6px 8px;background:var(--panel)}
.prow.on{border-color:var(--gold)}
.prow .t{flex:1;min-width:0;cursor:pointer;background:none;border:0;text-align:left;padding:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{background:none;border:1px solid var(--line2);width:30px;height:30px;cursor:pointer;flex:none;display:grid;place-items:center}
.ib:hover{border-color:var(--gold)}
.lrow{display:grid;grid-template-columns:130px minmax(0,1fr) 30px;gap:6px;align-items:center}
.lrow .lbl{grid-column:2/3}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.thumb{position:relative;border:1px solid var(--line);aspect-ratio:16/10;overflow:hidden;background:var(--bg)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .acts{position:absolute;inset:auto 0 0 0;display:flex;gap:2px;justify-content:flex-end;padding:3px;background:rgba(5,8,15,.7)}
.thumb .acts button{font-size:11px;padding:1px 6px;background:var(--panel);border:1px solid var(--line2);cursor:pointer}
.thumb .cv{position:absolute;top:3px;left:3px;background:var(--gold);color:var(--gold-ink);padding:0 5px}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.note{border:1px solid var(--gold);background:color-mix(in srgb,var(--gold) 8%,var(--bg));padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.note span{flex:1 1 200px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:90;background:var(--panel2);border:1px solid var(--gold);padding:10px 16px;max-width:min(520px,calc(100% - 32px));font-size:14px}

@media (max-width:760px){
  .hero{grid-template-columns:1fr}
  .portrait{flex-direction:row;align-items:center}
  .portrait .pic{width:110px;flex:none}
  .counts{flex:1}
  .status{padding:20px}
  .kv{grid-template-columns:1fr;gap:4px}
  .kv>.px{padding-top:8px}
  .entry{grid-template-columns:1fr}
  .grid{grid-template-columns:1fr}
  .dhead,.dbody{padding-left:18px;padding-right:18px}
  .bi{grid-template-columns:1fr}
  .lrow{grid-template-columns:1fr 30px}
  .lrow .lbl{grid-column:1/2}
  .nav{display:none}
}
</style>

<script type="application/json" id="pf-data">{"v":1,"profile":{"name":{"ko":"주다운","en":"Ju DaUn"},"title":{"ko":"시스템 기획자 · 무기/캐릭터 기획","en":"Systems Designer · Weapons \u0026 Characters"},"tagline":{"ko":"무기와 캐릭터의 손맛을 규칙과 수치로 설계하고, 팀이 같은 방향을 보도록 기획으로 이끕니다.","en":"I shape how weapons and characters feel through rules and numbers, and keep the team pointed in one direction."},"about":{"ko":"3D 로그라이트 FPS 「Alien Invasion」의 팀장이자 리드 기획자로 2023년부터 개발을 이끌고 있습니다. 시스템·무기·캐릭터·레벨·UI 기획을 직접 맡으며 최대 20명 규모의 팀을 운영했고, 해외 인디 팀과의 협업도 경험했습니다.\n\n개인 프로젝트로는 익스트랙션 슈터 「Escape from Ussuriysk」를 진행하고 있습니다. 60여 개의 기획 문서로 인벤토리, 탄도, 부위별 피해처럼 서로 맞물리는 시스템을 설계하고, ChatGPT와 Claude를 활용해 Unreal Engine 5에서 직접 구현하며 실제 실행 화면으로 검증합니다.\n\n기획서를 쓰는 데서 멈추지 않고 직접 만들어 보고 검증하는 실행력만큼은 어떤 주니어 기획자에게도 지지 않는다고 자신합니다.","en":"Since 2023 I have led development of the 3D roguelite FPS Alien Invasion as team lead and lead designer. I own systems, weapon, character, level and UI design, have run a team of up to 20 people, and have collaborated with an overseas indie team.\n\nOn my own I am building Escape from Ussuriysk, an extraction shooter. Across more than 60 design documents I specify interlocking systems such as grid inventory, ballistics and per-limb damage, then build them in Unreal Engine 5 with ChatGPT and Claude and check them against the running game.\n\nI don\u0027t stop at writing documents. I build, test and iterate, and I\u0027m confident that drive puts me ahead of other junior designers."},"specialties":{"ko":"시스템 기획, 무기 기획, 캐릭터 기획","en":"Systems design, Weapon design, Character design"},"tools":"Google Slides, Google Docs, Google Sheets, Figma, FigJam, Unity 6, Unreal Engine 5 (5.4.4 · 5.8), ChatGPT, Claude","email":"judaun0086@gmail.com","links":[],"photo":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEBLAEsAAD/4R80RXhpZgAATU0AKgAAAAgAEgEAAAMAAAABC+AAAAEBAAMAAAABB+sAAAECAAMAAAADAAAA5gEGAAMAAAABAAIAAAESAAMAAAABAAEAAAEVAAMAAAABAAMAAAEaAAUAAAABAAAA7AEbAAUAAAABAAAA9AEoAAMAAAABAAIAAAExAAIAAAAgAAAA/AEyAAIAAAAUAAABHA  \u0026 lead designer — Alien Invasion"},"org":{"ko":"Afterimage Studio (구 Consopra)","en":"Afterimage Studio (formerly Consopra)"},"desc":{"ko":"3D 로그라이트 FPS의 시스템·레벨·무기·캐릭터·UI 기획과 팀 운영을 맡고 있습니다.","en":"Systems, level, weapon, character and UI design for a 3D roguelite FPS, plus running the team."}},{"id":"t-xr","period":"2021.08 – 2021.09","title":{"ko":"XR아카데미 기본교육과정","en":"XR Academy, foundation course"},"org":{"ko":"(재)전남정보문화산업진흥원","en":"Jeonnam Information \u0026 Culture Industry Promotion Agency"},"desc":{"ko":"VR·AR 기초 이론과 Unity 기초를 배우고 VR 콘텐츠 프로젝트를 제작했습니다.","en":"VR/AR fundamentals and Unity basics, ending in a VR content project."}},{"id":"t-mokpo","period":"2020.03 – 2025.08","title":{"ko":"정보보호학과 졸업 (4년제)","en":"B.S. in Information Security"},"org":{"ko":"목포대학교","en":"Mokpo National University"},"desc":{"ko":"","en":""}}],"projects":[{"id":"q-alien-invasion","type":"team","sample":false,"title":{"ko":"Alien Invasion","en":"Alien Invasion"},"genre":{"ko":"3D 로그라이트 FPS","en":"3D roguelite FPS"},"summary":{"ko":"근미래, 미지의 기술을 연구하던 연구소에서 실수로 외계 생물이 소환되어 연구소 전체가 잠식됩니다. 주인공은 이 모든 문제를 해결하기 위해 연구소로 들어갑니다.","en":"In the near future, a lab researching unknown technology accidentally summons alien creatures that overrun the facility. The player goes in to set everything right."},"period":"2023.09 ~","teamSize":{"ko":"현재 5명 (기획 1 · 프로그래밍 3 · 아트 1), 최대 20명 참여","en":"5 now (1 design · 3 programming · 1 art), up to 20 at peak"},"role":{"ko":"팀장 · 리드 기획 (시스템, 레벨, 무기, 캐릭터, UI)","en":"Team lead \u0026 lead designer (systems, levels, weapons, characters, UI)"},"tools":"Google Slides, Google Docs, Google Sheets, Figma, FigJam, Unreal Engine 5.4.4 (Blueprint)","metrics":{"ko":"30% | 챕터 1 개발 진행도\n15시간 | 예상 플레이타임\n20명 | 최대 팀 규모 운영 경험","en":"30% | Chapter 1 development progress\n15 hrs | Planned playtime\n20 | Peak team size managed"},"problem":{"ko":"「Alien Invasion」에서는 탐색형 FPS의 진행에 로그라이트의 조합과 성장 재미를 결합하고 싶었습니다. 같은 무기로 적을 처치하는 행동이 반복되더라도, 탐색에서 얻은 보상과 플레이어의 선택에 따라 전투 방식이 달라지는 것이 목표였습니다.\n\n팀에서 중요하게 여긴 가치는 ‘감각 · 도전 · 발견’입니다. 전투 자체의 손맛뿐 아니라 새로운 구역과 보상을 발견하고, 그것으로 다음 전투를 다르게 풀어 가는 경험을 만들고자 했습니다.","en":"With Alien Invasion I wanted to combine the progression of an exploration FPS with the build-crafting and growth of a roguelite. Even when the act of shooting enemies with the same weapon repeats, the way each fight plays out should change with the rewards found while exploring and the choices the player makes.\n\nThe team\u0027s core values were Sensation, Challenge and Discovery: not only the feel of combat itself, but finding new areas and rewards and using them to approach the next fight differently."},"intent":{"ko":"캐릭터는 원거리 · 근접 · 샷건 · 저격처럼 주력 전투 방식을 구분하고, 무기는 피해량뿐 아니라 발사 속도, 장전, 확산, 반동, 탄속의 차이로 사용 감각을 나누고자 했습니다. 여기에 COBIT을 더해 같은 캐릭터와 무기를 사용하더라도 다른 조합을 선택할 수 있도록 설계했습니다.\n\n가장 강조하고 싶은 기획은 COBIT입니다. 전투와 탐색으로 조각을 얻고, 중앙 컴퓨터에서 조각을 소모해 COBIT을 획득하는 구조입니다. 획득한 효과와 인벤토리의 제한된 공간을 고려해 무엇을 보유할지 선택하게 했습니다. 단순히 수치가 높아지는 성장보다, 얻은 효과에 맞춰 기존 전투 방식을 조정하는 재미를 의도했습니다.","en":"Characters are split by their main combat style: ranged, melee, shotgun and sniper. Weapons differ not only in damage but in fire rate, reload, spread, recoil and projectile speed, so each one feels distinct in the hand. On top of that, COBITs let players build different combinations even with the same character and weapon.\n\nCOBIT is the design I\u0027m proudest of. Players earn fragments through combat and exploration, then spend them at the central computer to obtain COBITs. Inventory space is limited, so they have to choose which effects to keep. Rather than growth that only raises numbers, the goal was the fun of adapting your playstyle to the effects you find."},"impl":{"ko":"기획 문서에는 시스템의 동작 흐름과 예외 규칙을 정리하고, 시트에는 무기별 수치와 데이터를 비교할 수 있도록 구성했습니다. 피그마는 UI 설계와 실제 인게임 화면 구성을 구체화하는 데 사용했습니다. 화면에 어떤 정보를 어디에 배치할지 시각화해 개발자와 같은 화면을 기준으로 논의했습니다.\n\n개발 과정에서는 문서를 전달하는 데서 끝내지 않고, 피드백에서 드러난 모호함을 수정했습니다. 예를 들어 무기 사거리의 의미와 ShotID의 정의를 보완했고, 원거리 공격을 투사체 방식으로 결정한 뒤에는 탄속 · 충돌 · 관통 규칙을 관련 문서에 함께 반영했습니다.\n\n직접 구현한 기능은 Unreal Engine 5.4.4 Blueprint 기반의 인벤토리 시스템입니다. 시스템 기획과 UI 설계를 실제 동작으로 연결해 본 경험이 있으며, 팀장으로서 다른 기능의 설계와 개발 조율도 담당했습니다.","en":"Design documents laid out each system\u0027s flow and exception rules, and spreadsheets organized per-weapon values for side-by-side comparison. In Figma I worked out the UI and the in-game screen layout, visualizing what information goes where so the programmers and I could discuss the same screen.\n\nI didn\u0027t stop at handing over documents; I fixed the ambiguities that feedback exposed. For example, I clarified what weapon range means and how ShotID is defined, and once we chose projectiles for ranged attacks, I carried projectile speed, collision and penetration rules into every related document.\n\nThe feature I built myself is a Blueprint inventory system in Unreal Engine 5.4.4, connecting systems and UI design to working behavior. As team lead I also coordinated the design and development of the other features."},"result":{"ko":"프로젝트 초반에는 20명 가까운 인원이 함께하면서 일정과 업무 배분을 통제하기가 가장 어려웠습니다. 사람을 움직이는 일이 기획만큼 어렵다는 것을 배웠고, 인원 변화를 겪으며 일정 수립과 업무 분배 방식을 다듬어 지금은 15명 규모에서도 안정적으로 운영할 수 있게 되었습니다.\n\n개발자와 꾸준히 소통하며 기획 의도를 구현 가능한 언어로 전달하는 법을 익혔습니다. 의견이 충돌할 때는 각 의견을 게임의 방향성에 대입해 보고 결론을 정리하는 과정을 만들었습니다.\n\n해외 인디 팀과 협업하며 언어와 일하는 방식이 다른 팀과 함께 개발하는 방법도 경험했습니다.","en":"Early on, with close to 20 people on the team, keeping schedules and task allocation under control was the hardest part. I learned that moving people is as hard as designing systems, and through changes in team size I refined how I plan and divide work. I can now run a 15-person team steadily.\n\nWorking closely with programmers taught me to express design intent in terms they can build. When opinions clashed, I set up a process of weighing each one against the game\u0027s direction and writing down the conclusion.\n\nI also collaborated with an overseas indie team and learned how to build alongside a team with a different language and way of working."},"links":[{"kind":"drive","label":"Design docs (Google Drive)","url":"https://drive.google.com/drive/u/0/folders/1pWZgXfn1TdslnoMRKXnbqaqjnIBv0bTf"},{"kind":"youtube","label":"YouTube — Studio Consopra","url":"https://www.youtube.com/@StudioConsopra"}],"shots":[]},{"id":"q-ussuriysk","type":"solo","sample":false,"title":{"ko":"Escape from Ussuriysk","en":"Escape from Ussuriysk"},"genre":{"ko":"익스트랙션 슈터 (Escape from Tarkov 모작)","en":"Extraction shooter (Escape from Tarkov study remake)"},"summary":{"ko":"Escape from Tarkov를 참고한 비상업 개인 모작입니다. 장비 준비 → 레이드 → 전투·획득 → 탈출/사망 → 정산 → 창고 보관으로 이어지는 핵심 루프를 직접 기획하고, Unreal Engine 5에서 구현·검증하며 시스템 기획 역량을 키우고 있습니다.","en":"A non-commercial personal study remake of Escape from Tarkov. I design the core loop of gear up → raid → fight and loot → extract or die → settle → stash, and build and verify it in Unreal Engine 5 to grow as a systems designer."},"period":"2026.10 ~","teamSize":{"ko":"1명 (개인)","en":"1 (solo)"},"role":{"ko":"기획 전반 · 구현 검증 (1인)","en":"All design and implementation review (solo)"},"tools":"Unreal Engine 5 (5.4.4 → 5.8), Blender, ChatGPT, Claude","metrics":{"ko":"63개 | 기획·명세 문서\n5개 | 핵심 시스템 (인벤토리 · 무기/탄도 · 부위 피해 · 레이드 · AI)\n7부위 | 부위별 체력·치료 설계","en":"63 | Design and spec documents\n5 | Core systems (inventory, weapons/ballistics, limb damage, raids, AI)\n7 limbs | Per-limb health and healing"},"problem":{"ko":"타르코프의 재미는 인벤토리, 탄도, 부위별 피해, 레이드 정산이 서로 맞물리는 데서 나옵니다. 이 시스템들이 어떻게 연결되는지 플레이어가 아니라 기획자의 눈으로 이해하고, 직접 문서로 재구성해 보는 것이 목표였습니다.","en":"Tarkov\u0027s appeal comes from inventory, ballistics, limb damage and raid settlement locking together. My goal was to understand those links as a designer rather than a player, and rebuild them in my own documents."},"intent":{"ko":"핵심 루프를 5개 시스템으로 나누고, 시스템마다 규칙·수치·예외 상황을 문서로 먼저 정의했습니다. 확정된 결정과 임시 가정을 구분해 결정 기록에 남기고, 로드맵은 손맛·연출 → 전투·장비 → 경제·메타의 3단계로 나누어 단계가 끝날 때마다 직접 플레이테스트하도록 설계했습니다.","en":"I split the core loop into five systems and defined rules, numbers and edge cases in documents before building anything. Confirmed decisions and working assumptions are logged separately, and the roadmap runs in three phases (feel and presentation → combat and gear → economy and meta) with a hands-on playtest at the end of each."},"impl":{"ko":"기획 문서를 기준으로 ChatGPT와 Claude를 AI 코딩 도구로 활용해 Unreal Engine 5에서 격자 인벤토리(이동·회전·분할·병합), 6슬롯 장비와 무게, 실제 탄창·약실 기반 재장전과 사격 모드, 서버 판정 탄도, 7부위 체력과 치료 타이머, 메인 메뉴 12페이지 전환을 구현하고 실제 실행 화면으로 검증했습니다.\n\n무엇을 만들지, 규칙과 수치를 어떻게 정할지는 직접 기획하고 판단했으며, AI는 그 기획을 코드로 옮기는 도구로 사용했습니다. 개발 도중 Unreal Engine 5.4.4에서 5.8로 엔진을 옮기는 결정도 백업과 함께 직접 진행했습니다.","en":"Working from my design documents, I used ChatGPT and Claude as AI coding tools to build in Unreal Engine 5: grid inventory (move, rotate, split, merge), six gear slots with weight, magazine- and chamber-based reloading and fire modes, server-side ballistics, seven-limb health with healing timers, and a 12-page main menu, all verified with in-engine captures.\n\nI decided what to build and set the rules and numbers myself; AI was the tool that turned those designs into code. Mid-project I also made and carried out the move from Unreal Engine 5.4.4 to 5.8, with a full backup first."},"result":{"ko":"복잡한 시스템일수록 규칙을 문서로 먼저 고정해야 구현과 검증이 흔들리지 않는다는 것을 배웠습니다. 다음 단계로 우수리스크 역 맵(약 500m, 35분 이상 레이드)과 경제·메타 시스템을 설계할 예정입니다.","en":"The more complex the system, the more it pays to pin the rules down in writing first, so building and testing stay stable. Next up: the Ussuriysk Station map (about 500 m, raids of 35+ minutes) and the economy and meta systems."},"links":[],"shots":["data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEAYABgAAD/4QA6RXhpZgAATU0AKgAAAAgAA1EQAAEAAAABAQAAAFERAAQAAAABAAAAAFESAAQAAAABAAAAAAAAAAD/2wBDAAYEBQUFBAYFBQUHBgYHCQ8KCQgICRMNDgsPFhMXFxYTFRUYGyMeGBohGhUVHikfISQlJygnGB0rLismLiMmJyb/2wBDAQYHBwkICRIKChImGRUZJiYmJiYmJiYmJiYmJiYmJiYmJiYmJiYmJiYmJiYmJiYmJiYmJiYmJiYmJiYmJiYmJib/wAARCALQBQADASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKF var KTAG={slides:'SLD',docs:'DOC',sheets:'XLS',ppt:'PPT',youtube:'▶ YT',drive:'DRV',other:'URL'};
var KINDS=['slides','docs','sheets','ppt','youtube','drive','other'];

var state;
try{state=JSON.parse(document.getElementById('pf-data').textContent)}catch(e){state={}}
state.profile=state.profile||{};state.projects=state.projects||[];state.timeline=state.timeline||[];

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function safeUrl(u){u=String(u||'').trim();return /^https:\/\/[^\s"'<>]+$/i.test(u)?u:''}
function img(s){return /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/.test(s||'')?s:''}
function tx(v){if(v==null)return'';if(typeof v==='string')return v;var a=v[lang];return(a&&a.trim())?a:(v.ko||v.en||'')}
function L(k){return(T[lang]&&T[lang][k])||T.ko[k]||k}
function paras(s){s=String(s||'').trim();if(!s)return'';return s.split(/\n\s*\n/).map(function(p){return'<p>'+esc(p).replace(/\n/g,'<br>')+'</p>'}).join('')}
function list(s){return String(s||'').split(/[,\n]/).map(function(x){return x.trim()}).filter(Boolean)}
function rar(p){return p.type==='team'?'var(--team)':'var(--solo)'}
function newId(pre){return pre+Math.random().toString(36).slice(2,8)}

/* ---------- view ---------- */

  document.documentElement.lang=lang;

  var p=state.profile,name=tx(p.name);
  var h='<div class="page">';
  h+='<header class="bar"><div class="wrap"><div class="brand"><i></i><span>'+esc(name||L('brand'))+'</span></div>'+
    '<nav class="nav" aria-label="sections"><button data-go="s-profile">'+L('nProfile')+'</button><button data-go="s-projects">'+L('nProjects')+'</button><button data-go="s-career">'+L('nCareer')+'</button><button data-go="s-resume">'+L('nResume')+'</button></nav>'+
    '<div class="seg" role="group" aria-label="language"><button data-lang="ko" aria-pressed="'+(lang==='ko')+'">KO</button><button data-lang="en" aria-pressed="'+(lang==='en')+'">EN</button></div>'+
    (canEdit&&!editing?'<button class="btn small primary" data-act="open-editor">'+L('edit')+'</button>':'')+

}

    '<div style="--c:var(--team)"><b style="color:var(--team)">'+nt+'</b><span class="px">'+L('cTeam')+'</span></div>'+
    '<div><b style="color:var(--solo)">'+ns+'</b><span class="px">'+L('cSolo')+'</span></div></div></div>'+
    '<div class="frame status"><div><div class="px cls">// '+L('status')+' · '+esc(tx(p.title))+'</div><h1>'+esc(name)+'</h1></div>'+
    (tx(p.tagline)?'<p class="tagline">'+esc(tx(p.tagline))+'</p>':'')+
    '<div class="kv">'+(spec?'<span class="px">'+L('specialties')+'</span><div class="chips">'+spec+'</div>':'')+
    (tools?'<span class="px">'+L('tools')+'</span><div class="chips">'+tools+'</div>':'')+
    ((mail||links)?'<span class="px">'+L('contact')+'</span><div class="contact">'+mail+links+'</div>':'')+

    (tx(p.about)?'<div class="about" style="margin-top:28px">'+paras(tx(p.about))+'</div>':'')+

function resTags(pr){
  var seen={};(pr.links||[]).forEach(function(l){if(safeUrl(l.url))seen[l.kind]=1});
  return KINDS.filter(function(k){return seen[k]}).map(function(k){return'<span class="px">'+KTAG[k]+'</span>'}).join('');
}
function renderProjects(){
  var ps=state.projects,nt=ps.filter(function(x){return x.type==='team'}).length;
  var shown=ps.filter(function(x){return filter==='all'||x.type===filter});
  var tab=function(k,label,n,c){return'<button data-filter="'+k+'" aria-pressed="'+(filter===k)+'">'+(c?'<i class="dot" style="--c:'+c+'"></i>':'')+esc(label)+' <span class="n">'+n+'</span></button>'};
  var h='<section id="s-projects"><div class="wrap"><div class="shead"><span class="px">// '+L('quests')+'</span><h2>'+L('projects')+'</h2></div>'+
    '<div class="tabs" role="group">'+tab('all',L('all'),ps.length)+tab('team',L('team'),nt,'var(--team)')+tab('solo',L('solo'),ps.length-nt,'var(--solo)')+'</div>';
  if(!shown.length)h+='<div class="frame empty">'+L('noProjects')+'</div>';
  else{
    h+='<div class="grid">'+shown.map(function(pr){
      var cv=img((pr.shots||[])[0]),t=tx(pr.title);
      var meta=[tx(pr.genre),pr.period].filter(Boolean).map(esc).join(' · ');
      return'<a class="frame card" href="#'+esc(pr.id)+'" style="--rar:'+rar(pr)+'">'+
        '<div class="cover">'+(cv?'<img src="'+cv+'" alt="" loading="lazy">':'<div class="ph">'+esc(t.replace(/^\[[^\]]*\]\s*/,'').charAt(0)||'?')+'</div>')+
        '<span class="badge px">'+(pr.type==='team'?L('party'):L('solotag'))+'</span>'+(pr.sample?'<span class="sample px">'+L('sample')+'</span>':'')+'</div>'+
        '<div class="cbody"><h3>'+esc(t)+'</h3>'+(meta?'<div class="meta">'+meta+'</div>':'')+
        (tx(pr.role)?'<div class="meta">'+L('role')+' · '+esc(tx(pr.role))+'</div>':'')+
        (tx(pr.summary)?'<p class="sum">'+esc(tx(pr.summary))+'</p>':'')+
        '<div class="res">'+resTags(pr)+'</div></div></a>';
    }).join('')+'</div>';
  }
  return h+'</div></section>';
}
function renderTimeline(){
  var tl=state.timeline;
  var h='<section id="s-career"><div class="wrap"><div class="shead"><span class="px">// '+L('log')+'</span><h2>'+L('career')+'</h2></div>';
  if(!tl.length)h+='<div class="frame empty">'+L('noTimeline')+'</div>';
  else h+='<div class="log">'+tl.map(function(e){
    return'<div class="entry"><div class="when">'+esc(e.period)+'</div><div><h3>'+esc(tx(e.title))+(e.sample?' <span class="chip g px" style="font-size:9px">'+L('sample')+'</span>':'')+'</h3>'+
      (tx(e.org)?'<div class="org">'+esc(tx(e.org))+'</div>':'')+(tx(e.desc)?'<p>'+esc(tx(e.desc)).replace(/\n/g,'<br>')+'</p>':'')+'</div></div>';
  }).join('')+'</div>';
  return h+'</div></section>';
}
function renderResume(){
  var p=state.profile,u=safeUrl(p.resumeUrl);
  return'<section id="s-resume"><div class="wrap"><div class="shead"><span class="px">// '+L('resumeL')+'</span><h2>'+L('resume')+'</h2></div>'+
    '<div class="frame resume"><p>'+esc(tx(p.resumeNote))+'</p>'+
    (u?'<a class="btn primary" href="'+esc(u)+'" target="_blank" rel="noopener">'+L('openResume')+' ↗</a>':'')+
    '</div></div></section>';

function curProject(){var id=location.hash.slice(1);if(!id)return null;for(var i=0;i<state.projects.length;i++)if(state.projects[i].id===id)return state.projects[i];return null}
function renderDetail(){
  var box=document.getElementById('detail');if(!box)return;
  var pr=curProject();
  document.body.style.overflow=(pr||lightSrc)?'hidden':'';
  if(!pr){box.innerHTML=lightSrc?'<div class="lightbox" data-act="close-light"><img src="'+lightSrc+'" alt=""></div>':'';return}
  var shots=(pr.shots||[]).map(img).filter(Boolean);
  var stats=[['teamSize',tx(pr.teamSize)],['role',tx(pr.role)],['period',pr.period],['genre',tx(pr.genre)],['tools',pr.tools]].filter(function(s){return String(s[1]||'').trim()});
  var mets=String(tx(pr.metrics)||'').split('\n').map(function(l){return l.trim()}).filter(Boolean).map(function(l){var i=l.indexOf('|');return i<0?['',l]:[l.slice(0,i).trim(),l.slice(i+1).trim()]});
  var mats=(pr.links||[]).filter(function(l){return safeUrl(l.url)}).map(function(l){var k=KINDS.indexOf(l.kind)<0?'other':l.kind;
    return'<a class="btn'+(k==='youtube'?' yt':'')+'" href="'+esc(safeUrl(l.url))+'" target="_blank" rel="noopener"><span class="px">'+KTAG[k]+'</span>'+esc(l.label||L('k_'+k))+' ↗</a>'}).join('');
  var blk=function(k){var v=tx(pr[k]);return v.trim()?'<div class="blk"><h3>'+L(k)+'</h3>'+paras(v)+'</div>':''};
  var h='<div class="overlay" data-act="close-detail"><div class="dlg frame" role="dialog" aria-modal="true" aria-labelledby="dtitle" style="--rar:'+rar(pr)+'">'+
    '<div class="dhead"><div class="top"><span class="badge px">'+(pr.type==='team'?L('party')+' · '+L('team'):L('solotag')+' · '+L('solo'))+'</span>'+(pr.sample?'<span class="chip g px">'+L('sample')+'</span>':'')+
    '<button class="btn small x" data-act="close-detail-btn">'+L('close')+' ✕</button></div>'+
    '<h2 id="dtitle">'+esc(tx(pr.title))+'</h2>'+(tx(pr.summary)?'<div class="about">'+paras(tx(pr.summary))+'</div>':'')+'</div>'+
    (shots[0]?'<div class="dcover"><img src="'+shots[0]+'" alt="" data-light="0"></div>':'')+
    '<div class="dbody">'+
    (stats.length?'<div class="stats">'+stats.map(function(s){return'<div><span class="px">'+L(s[0])+'</span>'+esc(s[1])+'</div>'}).join('')+'</div>':'')+
    (mets.length?'<div class="blk"><h3>'+L('keyResults')+'</h3><div class="metrics">'+mets.map(function(m){return'<div class="metric">'+(m[0]?'<b>'+esc(m[0])+'</b>':'')+'<span>'+esc(m[1])+'</span></div>'}).join('')+'</div></div>':'')+
    (mats?'<div class="blk"><h3>'+L('materials')+'</h3><div class="mats">'+mats+'</div></div>':'')+
    blk('problem')+blk('intent')+blk('impl')+blk('result')+
    (shots.length>1?'<div class="blk"><h3>'+L('screens')+'</h3><div class="shots">'+shots.map(function(s,i){return'<button data-light="'+i+'" aria-label="'+L('screens')+' '+(i+1)+'"><img src="'+s+'" alt="" loading="lazy"></button>'}).join('')+'</div></div>':'')+
    '</div></div></div>';
  if(lightSrc)h+='<div class="lightbox" data-act="close-light"><img src="'+lightSrc+'" alt=""></div>';
  box.innerHTML=h;
}
window.addEventListener('hashchange',function(){lightSrc='';renderDetail()});

app.addEventListener('click',function(ev){
  var t=ev.target.closest('[data-go],[data-lang],[data-filter],[data-act],[data-light]');
  if(!t)return;
  if(t.dataset.go){var el=document.getElementById(t.dataset.go);if(el)el.scrollIntoView();return}
  if(t.dataset.lang){lang=t.dataset.lang;try{localStorage.setItem('pf-lang',lang)}catch(e){}render();if(editing)renderEditor();return}
  if(t.dataset.filter){filter=t.dataset.filter;render();return}
  if(t.dataset.light!=null&&t.dataset.act==null){var pr=curProject();if(pr){lightSrc=img(pr.shots[+t.dataset.light]);renderDetail()}return}
  var a=t.dataset.act;
  if(a==='close-detail'&&ev.target!==t)return;
  if(a==='close-detail'||a==='close-detail-btn'){history.replaceState(null,'',location.pathname+location.search);lightSrc='';renderDetail();return}
  if(a==='close-light'){lightSrc='';renderDetail();return}
  if(a==='copy-mail'){var m=state.profile.email;try{navigator.clipboard.writeText(m).then(function(){toast(L('copied'))},function(){selectMail()})}catch(e){selectMail()}return}
  if(a==='open-editor'){openEditor();return}
});
function selectMail(){var el=app.querySelector('.mail');if(!el)return;var r=document.createRange();r.selectNodeContents(el);var s=getSelection();s.removeAllRanges();s.addRange(r)}
document.addEventListener('keydown',function(e){if(e.key==='Escape'){if(lightSrc){lightSrc='';renderDetail()}else if(curProject()){history.replaceState(null,'',location.pathname+location.search);renderDetail()}}});

var toastTimer;
function toast(msg){var el=document.getElementById('pf-toast');if(!el){el=document.createElement('div');el.id='pf-toast';el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)}
  el.textContent=msg;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(function(){el.hidden=true},4200)}

/* ---------- editor (owner only) ---------- */
var drawer=null,dl=null;
function exportFile(){
  if(!dl)return;
  if(dirty())toast('게시하지 않은 변경도 파일에 포함됩니다. [저장하고 게시]도 함께 눌러 주세요.');
  dl.save({filename:'index.html',data:buildDoc()}).then(function(){toast('index.html을 받았습니다. GitHub 저장소에 올려 기존 파일을 바꿔 주세요.')},function(err){
    var c=err&&err.code;
    if(c==='declined')return;
    if(c==='rate_limited')toast('이미 저장 창이 열려 있습니다. 잠시 후 다시 눌러 주세요.');
    else if(c==='host_unavailable')toast('이 앱에서는 파일을 받을 수 없습니다. 컴퓨터 브라우저에서 열어 주세요.');
    else toast('파일을 받을 수 없습니다.');
  });
}
function getPath(path){return path.split('.').reduce(function(o,k){return o==null?undefined:o[k]},state)}
function setPath(path,val){var ks=path.split('.'),o=state;for(var i=0;i<ks.length-1;i++){if(o[ks[i]]==null||typeof o[ks[i]]!=='object')o[ks[i]]={};o=o[ks[i]]}o[ks[ks.length-1]]=val}
function vq(v){return esc(v==null?'':v)}
function fld(label,path,o){o=o||{};var v=getPath(path);var id='f-'+path.replace(/\./g,'-');
  var input=o.area?'<textarea id="'+id+'" data-path="'+path+'" rows="'+(o.rows||4)+'">'+vq(v)+'</textarea>':'<input id="'+id+'" type="'+(o.type||'text')+'" data-path="'+path+'" value="'+vq(v)+'" placeholder="'+vq(o.ph||'')+'">';
  return'<div class="f"><label for="'+id+'">'+label+'</label>'+input+(o.hint?'<div class="hint">'+o.hint+'</div>':'')+'</div>'}
function bfld(label,path,o){o=o||{};var one=function(lg){var p=path+'.'+lg,v=getPath(p),id='f-'+p.replace(/\./g,'-');
    return'<div>'+(o.area?'<textarea id="'+id+'" data-path="'+p+'" rows="'+(o.rows||4)+'" aria-label="'+label+' '+lg+'">'+vq(v)+'</textarea>':'<input id="'+id+'" type="text" data-path="'+p+'" value="'+vq(v)+'" aria-label="'+label+' '+lg+'">')+'<span class="tag">'+lg.toUpperCase()+'</span></div>'};
  return'<div class="f"><span class="lab">'+label+'</span><div class="bi">'+one('ko')+one('en')+'</div>'+(o.hint?'<div class="hint">'+o.hint+'</div>':'')+'</div>'}
function linkRows(base,arr,withKind){
  return(arr||[]).map(function(l,j){var p=base+'.'+j;
    return'<div class="lrow">'+(withKind?'<select data-path="'+p+'.kind" aria-label="종류">'+KINDS.map(function(k){return'<option value="'+k+'"'+(l.kind===k?' selected':'')+'>'+T.ko['k_'+k]+'</option>'}).join('')+'</select>':'<input type="text" data-path="'+p+'.label" value="'+vq(l.label)+'" placeholder="이름 (예: LinkedIn)" aria-label="링크 이름">')+
      '<input type="url" data-path="'+p+'.url" value="'+vq(l.url)+'" placeholder="https://..." aria-label="주소">'+
      '<button class="ib" data-act="rm-link" data-base="'+base+'" data-j="'+j+'" aria-label="링크 삭제">✕</button>'+
      (withKind?'<input class="lbl" type="text" data-path="'+p+'.label" value="'+vq(l.label)+'" placeholder="버튼에 보일 이름 (비우면 종류 이름)" aria-label="표시 이름">':'')+'</div>'}).join('');
}
function openEditor(){editing=true;render();renderEditor()}
function closeEditor(){editing=false;if(drawer){drawer.remove();drawer=null}render()}
function dirty(){return JSON.stringify(state)!==saved}
function renderEditor(){
  if(!drawer){drawer=document.createElement('aside');drawer.className='drawer';drawer.setAttribute('aria-label','편집');document.body.appendChild(drawer);
    drawer.addEventListener('input',onInput);drawer.addEventListener('change',onInput);drawer.addEventListener('click',onEditClick)}
  var keep=drawer.querySelector('.escroll'),top=keep?keep.scrollTop:0;
  var h='<div class="dtop"><h2>포트폴리오 편집</h2><button class="btn small" data-act="close-editor">미리보기만 보기 ✕</button></div>'+
    '<div class="etabs"><button data-etab="profile" aria-pressed="'+(etab==='profile')+'">프로필</button><button data-etab="projects" aria-pressed="'+(etab==='projects')+'">프로젝트</button><button data-etab="career" aria-pressed="'+(etab==='career')+'">경력 · 이력서</button></div>'+
    '<div class="escroll">'+draftNote()+(etab==='profile'?edProfile():etab==='projects'?edProjects():edCareer())+'</div>'+
    '<div class="efoot"><span class="st" id="ed-st"></span>'+(dl?'<button class="btn small" data-act="export" title="GitHub Pages에 올릴 index.html 파일을 받습니다">GitHub용 파일 받기</button>':'')+'<button class="btn small" data-act="revert">변경 취소</button><button class="btn primary" data-act="publish" id="ed-pub">저장하고 게시</button></div>';
  drawer.innerHTML=h;
  var sc=drawer.querySelector('.escroll');if(sc)sc.scrollTop=top;
  updStatus();

function draftNote(){
  var d=null;try{d=localStorage.getItem('pf-draft')}catch(e){}
  if(!d||d===saved||d===JSON.stringify(state))return'';

    '<label class="check"><input type="checkbox" data-path="'+b+'.sample" data-bool="1"'+(pr.sample?' checked':'')+'> 예시로 표시 (실제 내용으로 바꾸면 체크를 해제하세요)</label>'+
    bfld('제목',b+'.title')+bfld('한 줄 요약',b+'.summary',{area:1,rows:3})+bfld('장르',b+'.genre')+
    fld('기간',b+'.period',{ph:'2025.03 – 2025.08'})+bfld('팀 규모',b+'.teamSize',{hint:'예: 6명 (기획 2 · 개발 2 · 아트 2)'})+bfld('본인 역할',b+'.role')+fld('사용 툴',b+'.tools',{hint:'쉼표로 구분'})+
    bfld('성과 수치',b+'.metrics',{area:1,rows:3,hint:'한 줄에 하나씩 "수치 | 설명" 형식. 예: 42% | 플레이테스트 D1 리텐션'})+'</fieldset>'+
    '<fieldset><legend>상세 설명</legend>'+bfld('문제 정의',b+'.problem',{area:1})+bfld('설계 의도',b+'.intent',{area:1})+bfld('구현',b+'.impl',{area:1})+bfld('결과와 배운 점',b+'.result',{area:1})+'</fieldset>'+
    '<fieldset><legend>자료 링크</legend><div class="hint" style="font-size:12px;color:var(--faint)">구글 문서·시트·슬라이드는 공유 설정을 <b>링크가 있는 모든 사용자 · 뷰어</b>로 바꾼 뒤 링크를 붙여 넣으세요. PPT 파일은 구글 드라이브에 올려서 같은 방법으로 공유하면 됩니다. 유튜브 영상은 페이지 안에 재생되지 않고, 누르면 유튜브에서 열립니다.</div>'+
    linkRows(b+'.links',pr.links,true)+'<button class="btn small" data-act="add-link" data-base="'+b+'.links" style="align-self:flex-start">+ 자료 추가</button></fieldset>'+
    '<fieldset><legend>스크린샷</legend><div class="thumbs">'+(pr.shots||[]).map(function(s,j){var u=img(s);return u?'<div class="thumb"><img src="'+u+'" alt="">'+(j===0?'<span class="cv px">대표</span>':'')+'<div class="acts">'+(j?'<button data-act="cover" data-j="'+j+'">대표로</button>':'')+'<button data-act="rm-shot" data-j="'+j+'">삭제</button></div></div>':''}).join('')+'</div>'+
    '<label class="btn small" style="align-self:flex-start">이미지 올리기 (여러 장 가능)<input type="file" accept="image/*" multiple data-up="shots" hidden></label><div class="hint" style="font-size:12px;color:var(--faint)">첫 번째 이미지가 카드 표지가 됩니다. 한 장에 100~250KB 정도로 줄여서 넣습니다.</div></fieldset>'+
    '<button class="btn danger" data-act="del-proj" style="align-self:flex-start">'+(confirmDel==='p'+esel?'한 번 더 누르면 삭제됩니다':'이 프로젝트 삭제')+'</button>';
  return h;

function edCareer(){
  var tl=state.timeline;
  var h='<fieldset><legend>이력서</legend>'+fld('이력서 링크 (구글 드라이브 PDF 등)','profile.resumeUrl',{type:'url',ph:'https://drive.google.com/...',hint:'https:// 로 시작하는 주소만 버튼으로 표시됩니다.'})+bfld('이력서 섹션 설명','profile.resumeNote',{area:1,rows:3})+'</fieldset>';
  h+=tl.map(function(e,i){var b='timeline.'+i;
    return'<fieldset><legend>'+esc(tx(e.title)||'새 항목')+'</legend>'+fld('기간',b+'.period',{ph:'2023.03 – 2024.02'})+bfld('제목 (직무·과정명)',b+'.title')+bfld('소속',b+'.org')+bfld('설명',b+'.desc',{area:1,rows:3})+
      '<label class="check"><input type="checkbox" data-path="'+b+'.sample" data-bool="1"'+(e.sample?' checked':'')+'> 예시로 표시</label>'+
      '<div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn small" data-act="tup" data-i="'+i+'">↑ 위로</button><button class="btn small" data-act="tdown" data-i="'+i+'">↓ 아래로</button><button class="btn small danger" data-act="del-t" data-i="'+i+'">'+(confirmDel==='t'+i?'한 번 더 누르면 삭제':'삭제')+'</button></div></fieldset>'}).join('');
  return h+'<button class="btn small" data-act="add-t" style="align-self:flex-start">+ 경력 항목 추가</button>';

var viewTimer,draftTimer;
function changed(){clearTimeout(viewTimer);viewTimer=setTimeout(function(){render();updStatus()},250);
  clearTimeout(draftTimer);draftTimer=setTimeout(function(){try{if(dirty())localStorage.setItem('pf-draft',JSON.stringify(state))}catch(e){}},800)}
function onInput(ev){
  var t=ev.target;
  if(t.dataset.up&&ev.type==='change'){upload(t);return}
  if(!t.dataset.path)return;
  if(ev.type==='change'&&t.tagName!=='SELECT'&&t.type!=='checkbox')return;
  setPath(t.dataset.path,t.dataset.bool?t.checked:t.value);
  changed();
  if(t.tagName==='SELECT'&&/\.type$/.test(t.dataset.path))renderEditor();
}
function swap(arr,i,j){if(j<0||j>=arr.length)return false;var x=arr[i];arr[i]=arr[j];arr[j]=x;return true}
function blankProject(type){return{id:newId('q-'),type:type,sample:false,title:{ko:'',en:''},genre:{ko:'',en:''},summary:{ko:'',en:''},period:'',teamSize:type==='solo'?{ko:'1명 (개인)',en:'1 (solo)'}:{ko:'',en:''},role:{ko:'',en:''},tools:'',metrics:{ko:'',en:''},problem:{ko:'',en:''},intent:{ko:'',en:''},impl:{ko:'',en:''},result:{ko:'',en:''},links:[],shots:[]}}
function onEditClick(ev){
  var t=ev.target.closest('[data-act],[data-etab]');if(!t)return;
  if(t.dataset.etab){etab=t.dataset.etab;confirmDel=null;renderEditor();return}
  var a=t.dataset.act,i=+t.dataset.i,j=+t.dataset.j,ps=state.projects,tl=state.timeline,pr=ps[esel];
  if(a!=='del-proj'&&a!=='del-t')confirmDel=null;
  switch(a){
    case'close-editor':closeEditor();return;
    case'publish':publishNow();return;
    case'export':exportFile();return;
    case'revert':state=JSON.parse(saved);try{localStorage.removeItem('pf-draft')}catch(e){}break;
    case'restore':try{state=JSON.parse(localStorage.getItem('pf-draft'))}catch(e){}break;
    case'discard':try{localStorage.removeItem('pf-draft')}catch(e){}break;
    case'rm-photo':state.profile.photo='';break;
    case'add-link':var arr=getPath(t.dataset.base);if(!Array.isArray(arr)){arr=[];setPath(t.dataset.base,arr)}arr.push(t.dataset.base==='profile.links'?{label:'',url:''}:{kind:'slides',label:'',url:''});break;
    case'rm-link':getPath(t.dataset.base).splice(j,1);break;
    case'sel':esel=i;break;
    case'up':if(swap(ps,i,i-1)&&esel===i)esel=i-1;break;
    case'down':if(swap(ps,i,i+1)&&esel===i)esel=i+1;break;
    case'add-proj':ps.unshift(blankProject(t.dataset.type));esel=0;break;
    case'del-proj':if(confirmDel!=='p'+esel){confirmDel='p'+esel;renderEditor();return}ps.splice(esel,1);esel=Math.max(0,esel-1);confirmDel=null;break;
    case'cover':if(pr){var s=pr.shots.splice(j,1)[0];pr.shots.unshift(s)}break;
    case'rm-shot':if(pr)pr.shots.splice(j,1);break;
    case'add-t':tl.push({id:newId('t-'),period:'',title:{ko:'',en:''},org:{ko:'',en:''},desc:{ko:'',en:''}});break;
    case'tup':swap(tl,i,i-1);break;
    case'tdown':swap(tl,i,i+1);break;
    case'del-t':if(confirmDel!=='t'+i){confirmDel='t'+i;renderEditor();return}tl.splice(i,1);confirmDel=null;break;
    default:return;
  }
  render();renderEditor();changed();
}
function compress(file,max,q){return new Promise(function(res,rej){var url=URL.createObjectURL(file),im=new Image();
  im.onload=function(){var w=im.naturalWidth,h=im.naturalHeight,s=Math.min(1,max/Math.max(w,h));w=Math.max(1,Math.round(w*s));h=Math.max(1,Math.round(h*s));
    var c=document.createElement('canvas');c.width=w;c.height=h;var x=c.getContext('2d');x.fillStyle='#0c1120';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',q))};
  im.onerror=function(){URL.revokeObjectURL(url);rej(new Error('bad image'))};im.src=url})}
function upload(input){
  var files=[].slice.call(input.files||[]).filter(function(f){return/^image\//.test(f.type)});if(!files.length)return;
  toast('이미지를 줄이는 중...');
  var kind=input.dataset.up;
  Promise.all(files.map(function(f){return kind==='photo'?compress(f,480,.85):compress(f,1600,.8)})).then(function(urls){
    if(kind==='photo')state.profile.photo=urls[0];
    else{var pr=state.projects[esel];if(!pr)return;pr.shots=(pr.shots||[]).concat(urls)}
    render();renderEditor();changed();toast('이미지를 추가했습니다. [저장하고 게시]를 눌러야 반영됩니다.');
  },function(){toast('이미지를 읽지 못했습니다. JPG나 PNG 파일인지 확인해 주세요.')});
}

/* ---------- publish: regenerate the whole page from state ---------- */
var SKEL='<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>';
function buildDoc(){
  var name=(state.profile.name&&state.profile.name.ko)||'';
  var title=(name&&name!=='이름'?name+' · ':'')+'게임 기획 포트폴리오';
  var css=document.getElementById('pf-style').textContent,code=document.getElementById('pf-code').textContent;
  var json=JSON.stringify(state).replace(/</g,'\\u003c');
  var SC='<'+'/script>';
  return SKEL+'<title>'+esc(title)+'</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n'+
    '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Orbit&family=Silkscreen&display=swap">\n'+
    '<style id="pf-style">'+css+'</style>\n<div id="app"></div>\n<script type="application/json" id="pf-data">'+json+SC+'\n<script id="pf-code">'+code+SC+'\n</body></html>';
}
function publishNow(){
  if(!api){toast('이 화면에서는 저장할 수 없습니다.');return}
  var html=buildDoc();
  if(html.length>15.5*1024*1024){toast('페이지가 너무 큽니다. 스크린샷 몇 장을 지운 뒤 다시 시도해 주세요.');return}
  try{localStorage.setItem('pf-draft',JSON.stringify(state))}catch(e){}
  var pub=document.getElementById('ed-pub');if(pub){pub.disabled=true;pub.textContent='게시하는 중...'}
  api.publish(html).then(function(){toast('게시했습니다. 새 버전으로 다시 불러옵니다.')},function(err){
    var c=err&&err.code;
    if(c==='conflict')toast('다른 곳에서 먼저 저장된 버전이 있어 새로 불러옵니다. 편집 내용은 [불러오기]로 되살릴 수 있습니다.');
    else if(c==='too_large')toast('페이지가 너무 큽니다. 스크린샷 몇 장을 지운 뒤 다시 시도해 주세요.');
    else if(c==='rate_limited')toast('너무 자주 저장했습니다. 잠시 후 다시 눌러 주세요.');
    else if(c==='not_writer'||c==='not_granted'||c==='consent_required'||c==='not_declared'||c==='capability_disabled'||c==='capability_removed')toast('이 화면은 읽기 전용이라 저장할 수 없습니다.');
    else toast('저장하지 못했습니다. 잠시 후 다시 시도해 주세요.');
    if(pub){pub.disabled=false;pub.textContent='저장하고 게시'}
  });
}

render();
try{var d0=localStorage.getItem('pf-draft');if(d0&&d0===saved)localStorage.removeItem('pf-draft')}catch(e){}
if(window.claude&&typeof window.claude.use==='function'){
  Promise.all([window.claude.use('artifact'),window.claude.use('user')]).then(function(r){
    api=r[0];var u=r[1];if(!api||!u)return;
    return u.canEdit().then(function(ok){canEdit=!!ok;if(canEdit)render()});
  }).catch(function(){});
  window.claude.use('downloads').then(function(d){dl=d;if(drawer)renderEditor()}).catch(function(){});
}
})();
</script>
